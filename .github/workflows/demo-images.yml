name: Build public demo images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/demo-images.yml'
permissions:
  contents: read
  packages: write
concurrency:
  group: demo-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.2'
      - name: Backend checks
        working-directory: backend
        run: |
          uv sync --frozen --all-groups
          uv run ruff check src tests
          uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run build
          node --test tests/folderImport.test.cjs
  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
            file: backend/Dockerfile.demo
          - component: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:demo-${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:demo-latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=demo-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=demo-${{ matrix.component }}
